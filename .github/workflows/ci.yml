name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group test
      - name: Run test suite
        run: pytest tests/

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package with lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group lint
      - name: Run ruff check
        run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package with lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group lint
      - name: Run mypy
        run: mypy
