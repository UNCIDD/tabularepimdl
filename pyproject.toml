# pyproject.toml for tabularepimdl

[project]
name = "tabularepimdl"
version = "0.3.0"
description = "Flexible, rule-based epidemic modeling for multi-population settings."
readme = "README.md"
authors = [
    { name = "Justin Lessler", email = "jlessler@unc.edu" },
    { name = "Joshua Macdonald", email = "jmacdo16@jh.edu" },
    { name = "Yue Liu", email = "lyue@unc.edu" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "epidemiology",
    "forecasting",
    "modeling",
    "public-health",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "numba>=0.56",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib",
    "seaborn",
]
dev = [
    "mypy>=1.7",
    "ruff>=0.4",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
]

[project.urls]
Homepage = "https://github.com/UNCIDD/tabularepimdl"
Repository = "https://github.com/UNCIDD/tabularepimdl"
Issues = "https://github.com/UNCIDD/tabularepimdl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/tabularepimdl", "tests", "benchmark"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.ruff]
target-version = "py311"
# This codebase deliberately tolerates long lines (see ignore = ["E501"] below).
line-length = 200
# legacy/ and examples/ are non-shipped reference/experimental code (see legacy/README.md) --
# not held to the same lint bar as the maintained package.
exclude = ["__pycache__", ".venv", "legacy", "examples"]
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (undefined names, unused imports, etc.)
# B: flake8-bugbear (common bug patterns -- late-binding closures, mutable defaults, etc.)
# I: isort (import sorting)
# UP: pyupgrade (modern Python syntax)
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]  # line length -- not enforced, see line-length comment above

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.hatch.build.targets.wheel]
packages = ["src/tabularepimdl"]